      .brand { font-size: 18px; font-weight: 800; letter-spacing: 3.5px; fill: #7650E8; }
      .title { font-size: 46px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #6B7684; }
      .flowLabel { font-size: 16px; font-weight: 800; letter-spacing: 2.2px; fill: #8B95A1; }
      .cardTitle { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
      .cardBody { font-size: 16px; font-weight: 500; fill: #53606F; }
      .cardSmall { font-size: 14px; font-weight: 600; fill: #6B7684; }
      .whiteTitle { font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .whiteBody { font-size: 15px; font-weight: 600; fill: #F1ECFF; }
      .arrowLabel { font-size: 14px; font-weight: 700; fill: #6B7684; }
      .pill { font-size: 13px; font-weight: 800; }
