<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">marketvalley 핵심 시스템 아키텍처</title>
  <desc id="desc">서비스 사용자의 아이디어가 Next.js와 Claude를 거쳐 CampaignSpec으로 검증되고, 결정적 렌더러가 랜딩과 카드뉴스를 생성하며, 랜딩 방문자의 예약이 Turnstile과 Supabase를 거쳐 예약자명단과 사람의 판단으로 연결되는 구조</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#FCFBFF"/><stop offset="1" stop-color="#F4F0FF"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7650E8"/><stop offset="1" stop-color="#9673F2"/></linearGradient>
    <linearGradient id="purpleSoft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F5FF"/><stop offset="1" stop-color="#EEE8FF"/></linearGradient>
    <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#E8F2FF"/></linearGradient>
    <linearGradient id="mintSoft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2FBF8"/><stop offset="1" stop-color="#E5F8F1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#36265D" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8F82AA"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7650E8"/></marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#13966D"/></marker>
    <style>
