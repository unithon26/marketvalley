<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">marketvalley 시스템 아키텍처</title>
  <desc id="desc">서비스 사용자와 랜딩 방문자가 Vercel 또는 Oracle 배포의 단일 Next.js 애플리케이션에 접근하고, CampaignSpec을 중심으로 Anthropic, Supabase, Turnstile, 선택적 Meta PAUSED 초안 경로가 연결되는 구조</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FBFAFF"/>
      <stop offset="1" stop-color="#F5F1FF"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7650E8"/>
      <stop offset="1" stop-color="#9B7AF2"/>
    </linearGradient>
    <linearGradient id="softPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#EEE8FF"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F8FF"/>
      <stop offset="1" stop-color="#E8F2FF"/>
    </linearGradient>
    <linearGradient id="softMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FBF7"/>
      <stop offset="1" stop-color="#E4F8F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#32245D" flood-opacity="0.10"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#32245D" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#887AA8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7650E8"/>
    </marker>
    <style>
      text { font-family: "Apple SD Gothic Neo", "Nanum Gothic", sans-serif; fill: #191F28; }
      .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3.5px; fill: #7650E8; }
      .title { font-size: 44px; font-weight: 800; letter-spacing: -1.8px; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #6B7684; }
      .section { font-size: 17px; font-weight: 800; letter-spacing: 2px; fill: #8B95A1; }
      .cardTitle { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; }
      .cardBody { font-size: 16px; font-weight: 500; fill: #53606F; }
      .cardTiny { font-size: 14px; font-weight: 600; fill: #6B7684; }
      .whiteTitle { font-size: 23px; font-weight: 800; fill: #FFFFFF; }
      .whiteBody { font-size: 15px; font-weight: 600; fill: #F0EBFF; }
      .chip { font-size: 13px; font-weight: 800; fill: #6D3FEA; }
      .arrowLabel { font-size: 13px; font-weight: 700; fill: #6B7684; }
      .mono { font-family: "D2CodingLigature Nerd Font Mono", "SFMono-Regular", monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#page)"/>
  <circle cx="1765" cy="86" r="180" fill="#EDE7FF" opacity="0.55"/>
  <circle cx="84" cy="1035" r="220" fill="#EAF4FF" opacity="0.5"/>

  <!-- Header -->
  <text x="80" y="66" class="eyebrow">MARKETVALLEY</text>
  <text x="80" y="119" class="title">시스템 아키텍처</text>
  <text x="80" y="154" class="subtitle">단일 계약과 결정적 렌더러로 생성·게시·예약·판단을 연결하는 운영 구조</text>
  <g transform="translate(1644 61)">
    <rect x="0" y="0" width="194" height="58" rx="29" fill="#FFFFFF" stroke="#E1D9FA" filter="url(#smallShadow)"/>
    <path d="M28 18 L42 42 L58 14" fill="none" stroke="#8969EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="37" font-size="20" font-weight="800">market valley</text>
  </g>

  <!-- Delivery plane -->
  <text x="80" y="225" class="section">DELIVERY PLANE</text>
  <g filter="url(#smallShadow)">
    <rect x="80" y="248" width="270" height="112" rx="20" fill="#FFFFFF" stroke="#DFE3E8"/>
    <circle cx="123" cy="291" r="20" fill="#F3EFFF"/>
    <path d="M114 291h18M123 282v18" stroke="#7650E8" stroke-width="2.8" stroke-linecap="round"/>
    <text x="158" y="287" class="cardTitle">GitHub + CI</text>
    <text x="158" y="314" class="cardTiny">검증된 source SHA</text>
    <text x="102" y="343" class="mono" fill="#6D3FEA">lint · test · build · E2E</text>
  </g>

  <path d="M350 304 H430" fill="none" stroke="#887AA8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="368" y="289" class="arrowLabel">자동 배포</text>

  <g filter="url(#smallShadow)">
    <rect x="436" y="248" width="388" height="112" rx="20" fill="url(#softPurple)" stroke="#D6CBF7"/>
    <rect x="458" y="267" width="74" height="28" rx="14" fill="#FFFFFF"/>
    <text x="477" y="286" class="chip">공식</text>
    <text x="458" y="324" class="cardTitle">Vercel</text>
    <text x="546" y="324" class="cardBody">Next.js production</text>
    <text x="458" y="347" class="cardTiny">marketvaley.vercel.app</text>
  </g>

  <path d="M824 304 H884" fill="none" stroke="#C3B8DE" stroke-width="2"/>
  <text x="840" y="288" class="arrowLabel">동일 앱</text>

  <g filter="url(#smallShadow)">
    <rect x="890" y="248" width="624" height="112" rx="20" fill="url(#softBlue)" stroke="#CFE1F7"/>
    <rect x="912" y="267" width="98" height="28" rx="14" fill="#FFFFFF"/>
    <text x="929" y="286" class="chip" fill="#2269C8">독립 검증</text>
    <text x="912" y="324" class="cardTitle">OCI NLB → Caddy → rootless Docker</text>
    <text x="912" y="347" class="cardTiny">Next.js standalone · health 전환 · 직전 release rollback</text>
  </g>

  <path d="M1514 304 H1590" fill="none" stroke="#887AA8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#smallShadow)">
    <rect x="1596" y="248" width="244" height="112" rx="20" fill="#FFFFFF" stroke="#DFE3E8"/>
    <text x="1618" y="286" class="cardTitle">공통 상태 확인</text>
    <text x="1618" y="316" class="cardBody">/api/health</text>
    <text x="1618" y="342" class="cardTiny">SHA · 외부 의존성 readiness</text>
  </g>

  <!-- Runtime plane -->
  <text x="80" y="423" class="section">RUNTIME PLANE</text>

  <!-- Actors -->
  <g filter="url(#smallShadow)">
    <rect x="80" y="448" width="250" height="166" rx="24" fill="#FFFFFF" stroke="#DFE3E8"/>
    <circle cx="127" cy="496" r="24" fill="#F3EFFF"/>
    <circle cx="127" cy="489" r="8" fill="none" stroke="#7650E8" stroke-width="2.5"/>
    <path d="M110 514c4-12 30-12 34 0" fill="none" stroke="#7650E8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="166" y="491" class="cardTitle">서비스 사용자</text>
    <text x="166" y="518" class="cardTiny">예비창업가·1인 사업자</text>
    <text x="104" y="556" class="cardBody">2단계 입력 · 광고 생성</text>
    <text x="104" y="582" class="cardBody">예약 결과 확인 · 다음 판단</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="80" y="638" width="250" height="150" rx="24" fill="#FFFFFF" stroke="#DFE3E8"/>
    <circle cx="127" cy="685" r="24" fill="#E8F8F2"/>
    <path d="M115 685h24M127 673v24M117 676c6 5 14 13 20 20M137 676c-6 5-14 13-20 20" fill="none" stroke="#12845F" stroke-width="2" stroke-linecap="round"/>
    <text x="166" y="680" class="cardTitle">랜딩 방문자</text>
    <text x="166" y="707" class="cardTiny">공개 slug로 익명 접근</text>
    <text x="104" y="746" class="cardBody">이름·이메일·동의 예약</text>
    <text x="104" y="772" class="cardBody">중복 접수 방지</text>
  </g>

  <path d="M330 532 H382" fill="none" stroke="#7650E8" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="342" y="515" class="arrowLabel">인증</text>
  <path d="M330 712 H382" fill="none" stroke="#18A977" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="341" y="696" class="arrowLabel">공개</text>

  <!-- Application boundary -->
  <g filter="url(#shadow)">
    <rect x="388" y="448" width="850" height="340" rx="28" fill="#FFFFFF" stroke="#D9D0F2" stroke-width="2"/>
  </g>
  <rect x="388" y="448" width="850" height="66" rx="28" fill="#F7F4FF"/>
  <path d="M388 486v28h850v-28" fill="#F7F4FF"/>
  <circle cx="427" cy="481" r="9" fill="#7650E8"/>
  <text x="449" y="489" class="cardTitle">Next.js 16 App Router · BFF</text>
  <text x="981" y="489" class="cardTiny">단일 애플리케이션 경계</text>

  <g>
    <rect x="420" y="540" width="230" height="102" rx="18" fill="#F7F8FA" stroke="#E1E5EA"/>
    <text x="442" y="572" class="cardTitle">제품 UI</text>
    <text x="442" y="600" class="cardBody">/new · /campaigns/[id]</text>
    <text x="442" y="624" class="cardBody">/p/[slug] · report</text>
  </g>

  <path d="M650 591 H688" fill="none" stroke="#887AA8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="696" y="540" width="244" height="102" rx="18" fill="#F7F8FA" stroke="#E1E5EA"/>
    <text x="718" y="572" class="cardTitle">Route Handlers</text>
    <text x="718" y="600" class="cardBody">generate · campaigns</text>
    <text x="718" y="624" class="cardBody">reservations · meta</text>
  </g>

  <path d="M940 591 H978" fill="none" stroke="#7650E8" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <g>
    <rect x="986" y="530" width="220" height="122" rx="20" fill="url(#core)"/>
    <text x="1008" y="567" class="whiteTitle">CampaignSpec v2</text>
    <text x="1008" y="595" class="whiteBody">Zod 검증 · 단일 JSON 계약</text>
    <text x="1008" y="621" class="whiteBody">게시 시점 불변 snapshot</text>
  </g>

  <g>
    <rect x="420" y="670" width="330" height="86" rx="18" fill="#F8F5FF" stroke="#D9D0F2"/>
    <text x="442" y="702" class="cardTitle">보안·정책 경계</text>
    <text x="442" y="730" class="cardBody">Google PKCE · same-origin · quota · RLS</text>
  </g>

  <g>
    <rect x="772" y="670" width="434" height="86" rx="18" fill="#F1FBF7" stroke="#CFEBDD"/>
    <text x="794" y="702" class="cardTitle">결정적 React/CSS 렌더러</text>
    <text x="794" y="730" class="cardBody">랜딩 · 캐러셀 · PNG 5장 · ZIP · 게시 문구</text>
  </g>

  <path d="M1096 652 V670" fill="none" stroke="#7650E8" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- External services -->
  <text x="1280" y="423" class="section">MANAGED SERVICES</text>

  <path d="M1238 535 H1280" fill="none" stroke="#7650E8" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="1247" y="519" class="arrowLabel">생성</text>
  <g filter="url(#smallShadow)">
    <rect x="1288" y="448" width="260" height="144" rx="22" fill="#FFFFFF" stroke="#D9D0F2"/>
    <circle cx="1329" cy="489" r="18" fill="#F3EFFF"/>
    <path d="M1320 489l6 6 13-14" fill="none" stroke="#7650E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1360" y="487" class="cardTitle">Anthropic</text>
    <text x="1310" y="526" class="cardBody">Claude Sonnet 4.6</text>
    <text x="1310" y="552" class="cardBody">Structured Outputs 1회</text>
    <text x="1310" y="576" class="cardTiny">문구 슬롯만 생성 · 자동 재시도 0</text>
  </g>

  <path d="M1238 622 H1570" fill="none" stroke="#3182F6" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#smallShadow)">
    <rect x="1580" y="448" width="260" height="192" rx="22" fill="#FFFFFF" stroke="#CFE1F7"/>
    <circle cx="1621" cy="489" r="18" fill="#EAF3FF"/>
    <path d="M1610 485h22v15h-22zM1614 481h14" fill="none" stroke="#2269C8" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="1652" y="487" class="cardTitle">Supabase</text>
    <text x="1602" y="526" class="cardBody">Google Auth · HttpOnly session</text>
    <text x="1602" y="552" class="cardBody">Postgres · RLS · atomic RPC</text>
    <text x="1602" y="578" class="cardBody">campaigns · reservations</text>
    <text x="1602" y="604" class="cardTiny">소유권 · HMAC dedupe · quota</text>
  </g>

  <path d="M1238 700 H1280" fill="none" stroke="#18A977" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#smallShadow)">
    <rect x="1288" y="616" width="260" height="172" rx="22" fill="#FFFFFF" stroke="#CFEBDD"/>
    <circle cx="1329" cy="657" r="18" fill="#E8F8F2"/>
    <path d="M1329 646v22M1318 657h22" stroke="#12845F" stroke-width="2.2" stroke-linecap="round"/>
    <text x="1360" y="655" class="cardTitle">Turnstile</text>
    <text x="1310" y="694" class="cardBody">공개 예약 봇 방어</text>
    <text x="1310" y="720" class="cardBody">hostname 제한 · fail-closed</text>
    <text x="1310" y="746" class="cardTiny">Vercel·Oracle production</text>
  </g>

  <path d="M1548 702 H1580" fill="none" stroke="#B7A9D5" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <g filter="url(#smallShadow)">
    <rect x="1588" y="664" width="252" height="124" rx="22" fill="#FFFFFF" stroke="#D9D0F2" stroke-dasharray="7 6"/>
    <text x="1610" y="700" class="cardTitle">Meta Graph v26</text>
    <text x="1610" y="728" class="cardBody">내부 운영자 승인 경로</text>
    <text x="1610" y="754" class="cardTiny">선택적 P1 · PAUSED only</text>
  </g>

  <!-- Outcome plane -->
  <text x="388" y="846" class="section">OBSERVABLE OUTCOMES</text>

  <path d="M1096 756 V824" fill="none" stroke="#7650E8" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <g filter="url(#smallShadow)">
