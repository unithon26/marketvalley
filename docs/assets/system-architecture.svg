    <rect x="410" y="890" width="88" height="28" rx="14" fill="#F3EFFF"/>
    <text x="430" y="909" class="chip">PUBLIC</text>
    <text x="410" y="950" class="cardTitle">공개 랜딩 /p/[slug]</text>
    <text x="410" y="978" class="cardBody">배포 없이 snapshot 즉시 공개</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="742" y="868" width="330" height="132" rx="22" fill="#FFFFFF" stroke="#DFE3E8"/>
    <rect x="764" y="890" width="86" height="28" rx="14" fill="#E8F8F2"/>
    <text x="782" y="909" class="chip" fill="#12845F">SIGNAL</text>
    <text x="764" y="950" class="cardTitle">예약자명단</text>
    <text x="764" y="978" class="cardBody">실제 접수 · 이메일 마스킹</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="1096" y="868" width="330" height="132" rx="22" fill="#FFFFFF" stroke="#DFE3E8"/>
    <rect x="1118" y="890" width="88" height="28" rx="14" fill="#EAF3FF"/>
    <text x="1138" y="909" class="chip" fill="#2269C8">EXPORT</text>
    <text x="1118" y="950" class="cardTitle">PNG · ZIP · 게시 문구</text>
    <text x="1118" y="978" class="cardBody">같은 렌더러를 화면·파일에 재사용</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="1450" y="868" width="390" height="132" rx="22" fill="url(#softPurple)" stroke="#D6CBF7"/>
    <rect x="1472" y="890" width="88" height="28" rx="14" fill="#FFFFFF"/>
    <text x="1492" y="909" class="chip">HUMAN</text>
    <text x="1472" y="950" class="cardTitle">계속 · 수정 · 보류</text>
    <text x="1472" y="978" class="cardBody">공개·지출·다음 행동의 최종 판단</text>
  </g>

  <path d="M718 934 H742" fill="none" stroke="#C3B8DE" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1072 934 H1096" fill="none" stroke="#C3B8DE" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1426 934 H1450" fill="none" stroke="#7650E8" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <text x="80" y="1042" class="cardTiny">실선: P0 운영 경로</text>
  <line x1="226" y1="1037" x2="270" y2="1037" stroke="#B7A9D5" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="280" y="1042" class="cardTiny">점선: 선택적 P1 경로</text>
  <text x="1840" y="1042" text-anchor="end" class="cardTiny">2026.08.26 기준</text>
</svg>
