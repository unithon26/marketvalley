name: marketvalley

services:
  app:
    image: marketvalley:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is required}
    env_file:
      - ${MARKETVALLEY_ENV_FILE:?MARKETVALLEY_ENV_FILE is required}
    environment:
      APP_VERSION: ${APP_IMAGE_TAG}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    init: true
    restart: unless-stopped
    cpus: "1.50"
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 512m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - app_cache:/app/.next/cache
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health').then(async response => {
            const body = await response.json();
            if (!response.ok || body.status !== 'ok' || body.version !== process.env.APP_VERSION) process.exit(1);
          }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    networks:
      - app_internal
      - app_egress
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 64m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ${MARKETVALLEY_CADDYFILE:?MARKETVALLEY_CADDYFILE is required}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${MARKETVALLEY_BIND_ADDRESS:?MARKETVALLEY_BIND_ADDRESS is required}:${MARKETVALLEY_HTTP_PORT:?MARKETVALLEY_HTTP_PORT is required}:80/tcp"
      - "${MARKETVALLEY_BIND_ADDRESS:?MARKETVALLEY_BIND_ADDRESS is required}:${MARKETVALLEY_HTTPS_PORT:?MARKETVALLEY_HTTPS_PORT is required}:443/tcp"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    stop_grace_period: 30s
    networks:
      - app_internal
      - proxy_egress
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  app_cache:
    name: marketvalley_app_cache_${APP_IMAGE_TAG}
  caddy_data:
  caddy_config:

networks:
  app_internal:
    internal: true
  app_egress:
  proxy_egress:
